<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taco Express Peabody — Order by Voice with Diego</title>
  <link rel="canonical" href="https://www.tacoexpresspeabody.com/voice" />
  <link rel="icon" href="images/taco-express-logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="images/taco-express-logo.jpg" />
  <meta name="description" content="Order Taco Express Peabody by voice with Diego — tacos, burritos, enchiladas & quesadillas. 58 Pulaski St Unit B, Peabody MA. (978) 982-1800." />
  <link rel="alternate" type="text/plain" href="https://www.tacoexpresspeabody.com/llms.txt" title="LLM summary" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Taco Express Peabody" />
  <meta property="og:url" content="https://www.tacoexpresspeabody.com/voice" />
  <meta property="og:title" content="Order by Voice with Diego — Taco Express Peabody" />
  <meta property="og:description" content="Press the button — Diego takes your taco order by voice. Pay by card, pickup at 58 Pulaski St Unit B, Peabody MA." />
  <meta property="og:image" content="https://www.tacoexpresspeabody.com/images/taco-express-logo.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lime: #84cc16;
      --terra: #ea580c;
      --white: #ffffff;
      --charcoal: #1c1917;
    }
    html {
      background: var(--charcoal);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--charcoal);
      color: var(--white);
      display: flex;
      flex-direction: column;
      padding: 0 20px 40px;
    }
    .top-bar {
      background: #14532d;
      color: #bbf7d0;
      text-align: center;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      width: calc(100% + 40px);
      margin: 0 -20px 0;
    }
    .top-bar a { color: #fff; text-decoration: none; font-weight: 700; }
    .top {
      padding-top: 28px;
    }
    .top { text-align: center; flex-shrink: 0; }
    .voice-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      background: #fff;
    }
    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.6rem, 11vw, 4.2rem);
      letter-spacing: 0.06em;
      color: var(--lime);
      line-height: 1;
    }
    .outlet {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #ffffff;
      opacity: 1;
      line-height: 1.55;
    }
    .outlet a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }
    .menu-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
    }
    .menu-link:hover { color: #ffffff; }

    /* 80mm thermal — never wider than printer paper */
    .ticket-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0 8px;
      min-height: 140px;
    }
    #ticket {
      width: 80mm;
      max-width: min(80mm, 100%);
      box-sizing: border-box;
      overflow: hidden;
      color: var(--white);
      font-size: 0.88rem;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      display: none;
    }
    #ticket.has-items { display: block; }
    .fulfill-banner {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 10px;
      max-width: 100%;
      box-sizing: border-box;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
      color: #ffffff;
    }
    .fulfill-banner .fb-left {
      flex: 0 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .fulfill-banner .fb-right {
      flex: 0 1 auto;
      min-width: 0;
      text-align: right;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .fulfill-banner .fb-right.is-paid {
      color: var(--lime);
    }
    .pay-banner {
      margin-top: 10px;
      max-width: 100%;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 1rem;
      letter-spacing: 0.04em;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.2;
      color: #ffffff;
    }
    .pay-banner.is-paid {
      color: var(--lime);
    }
    .cust {
      margin-bottom: 10px;
      font-weight: 600;
      line-height: 1.35;
    }
    .cust .email {
      font-weight: 400;
      font-size: 0.82rem;
    }
    .line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 2.1rem 4.2rem;
      column-gap: 6px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .line .title {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .line .qty {
      white-space: nowrap;
      font-weight: 600;
      text-align: right;
      letter-spacing: 0.02em;
    }
    .line .price {
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
    }
    .line-note {
      grid-column: 1 / -1;
      margin: -1px 0 8px;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--white);
    }
    .totals {
      margin-top: 10px;
      padding-top: 2px;
    }
    .totals .line {
      margin-bottom: 4px;
      font-weight: 400;
    }
    .totals .line .title { font-weight: 500; }
    .totals .line.total-row {
      margin-top: 6px;
    }
    .totals .line.total-row .title,
    .totals .line.total-row .price {
      font-weight: 800;
      font-size: 0.98rem;
    }
    .paid-stamp {
      margin-top: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
      font-size: 0.95rem;
    }
    .paid-stamp .pi {
      display: block;
      margin-top: 4px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      font-size: 0.72rem;
      color: #ffffff;
      opacity: 1;
    }
    .instr {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--white);
    }
    .instr .label { font-weight: 700; margin-bottom: 3px; }
    .instr .body { white-space: pre-wrap; font-weight: 400; }

    .bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-top: 24px;
      padding-bottom: 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 90; /* above signup overlay so Hang Up always works */
    }
    #orderNowBtn {
      width: min(320px, 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 17px);
      letter-spacing: 0.02em;
      text-transform: none;
      line-height: 1.2;
      padding: 16px 28px;
      border-radius: 999px;
      color: #fff;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.08) 32%, transparent 55%),
        linear-gradient(180deg, #fb923c 0%, #ea580c 38%, #c2410c 100%);
      animation: diegoGelPulse 2.6s ease-in-out infinite;
      transition: filter 0.2s ease;
    }
    @keyframes diegoGelPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 8px 24px rgba(234, 88, 12, 0.42),
          0 0 0 0 rgba(132, 204, 22, 0),
          inset 0 2px 0 rgba(255, 255, 255, 0.4),
          inset 0 -12px 20px rgba(0, 0, 0, 0.28);
      }
      50% {
        transform: scale(1.03);
        box-shadow:
          0 16px 40px rgba(234, 88, 12, 0.55),
          0 0 36px 4px rgba(132, 204, 22, 0.32),
          inset 0 2px 0 rgba(255, 255, 255, 0.5),
          inset 0 -12px 20px rgba(0, 0, 0, 0.2);
      }
    }
    @keyframes diegoGelShine {
      0% { transform: translateX(-140%) skewX(-18deg); opacity: 0; }
      18% { opacity: 0.85; }
      42% { opacity: 0.55; }
      58%, 100% { transform: translateX(220%) skewX(-18deg); opacity: 0; }
    }
    @keyframes diegoGelRipple {
      0% { box-shadow: 0 0 0 0 rgba(132, 204, 22, 0.42); opacity: 1; }
      100% { box-shadow: 0 0 0 22px rgba(132, 204, 22, 0); opacity: 0; }
    }
    #orderNowBtn::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 0;
      width: 42%;
      height: 140%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 30%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0.08) 70%,
        transparent 100%
      );
      animation: diegoGelShine 3.4s ease-in-out infinite;
      pointer-events: none;
    }
    #orderNowBtn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      animation: diegoGelRipple 2.6s ease-out infinite;
      pointer-events: none;
    }
    #orderNowBtn .btn-main,
    #orderNowBtn .btn-sub {
      position: relative;
      z-index: 1;
    }
    #orderNowBtn .btn-sub {
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }
    #orderNowBtn:hover { filter: brightness(1.08); }
    #orderNowBtn:active:not(.live):not(.canceling) {
      filter: brightness(0.96);
      transform: scale(0.98);
      animation: none;
    }
    #orderNowBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    /* Hang Up / Cancel must stay clickable even while connecting */
    #orderNowBtn.live,
    #orderNowBtn.canceling {
      opacity: 1;
      cursor: pointer;
      pointer-events: auto;
      animation: none;
      border: none;
      overflow: visible;
    }
    #orderNowBtn.live::before,
    #orderNowBtn.live::after,
    #orderNowBtn.canceling::before,
    #orderNowBtn.canceling::after {
      display: none;
    }
    #orderNowBtn.live {
      background: var(--lime);
      color: #14532d;
      box-shadow: none;
    }
    #status {
      min-height: 1.2em;
      font-size: 0.82rem;
      color: #ffffff;
      opacity: 1;
      text-align: center;
    }
    .card-trust {
      margin-top: 6px;
      max-width: 22rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--white);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .card-trust a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }
    .card-trust-sub {
      font-size: 0.72rem;
      color: #ffffff;
      opacity: 1;
      font-weight: 500;
    }

    /* First-time hands-free signup overlay (/voice-signup) */
    #signupOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.72);
      padding: 16px;
      align-items: stretch;
      justify-content: center;
    }
    #signupOverlay.open {
      display: flex;
    }
    .signup-panel {
      width: min(100%, 28rem);
      margin: 0 auto;
      background: var(--charcoal);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: min(92vh, 820px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }
    .signup-panel-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: #0c0a09;
      flex-shrink: 0;
    }
    .signup-panel-bar span {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--lime);
    }
    .signup-panel-bar button {
      border: none;
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 6px 10px;
    }
    #signupFrame {
      flex: 1;
      width: 100%;
      min-height: 420px;
      border: 0;
      background: var(--charcoal);
    }
    /* Embedded on homepage menu sheet — hide full-page chrome */
    body.embed-mode {
      min-height: 100%;
      height: 100%;
      padding: 8px 12px 12px;
    }
    body.embed-mode .top-bar,
    body.embed-mode .top {
      display: none;
    }
    body.embed-mode .ticket-wrap {
      min-height: 80px;
      padding: 8px 0;
      align-items: flex-start;
    }
    body.embed-mode .card-trust {
      font-size: 0.72rem;
    }
    html.embed-mode,
    html.embed-mode body {
      height: 100%;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    58 Pulaski St Unit B · Peabody MA 01960 · <a href="tel:+19789821800">(978) 982-1800</a>
  </div>
  <div class="top">
    <img class="voice-logo" src="images/taco-express-logo.jpg" width="96" height="96" alt="Taco Express Peabody" />
    <h1>Taco Express Peabody</h1>
    <p class="outlet">
      58 Pulaski Street Unit B<br>
      <a href="tel:+19789821800">(978) 982-1800</a>
    </p>
    <a class="menu-link" href="/">← Menu &amp; photos</a>
  </div>

  <div class="ticket-wrap">
    <div id="ticket" aria-live="polite"></div>
  </div>

  <div class="bottom">
    <button type="button" id="orderNowBtn" aria-label="Diego will take your order. Press button now.">
      <span class="btn-main">Diego will take your order</span>
      <span class="btn-sub">Press button now</span>
    </button>
    <p id="status" aria-live="polite"></p>
    <p class="card-trust">
      <a href="/voice-signup" id="signupLink">First-time customers: sign up for hands-free ordering</a>
      <span class="card-trust-sub">Stripe keeps your card number safe — we never see it.</span>
    </p>
  </div>

  <div id="signupOverlay" aria-hidden="true">
    <div class="signup-panel" role="dialog" aria-label="Save card for voice pay">
      <div class="signup-panel-bar">
        <span>First-time voice signup</span>
        <button type="button" id="signupCloseBtn">Close</button>
      </div>
      <iframe id="signupFrame" title="Save card for voice pay"></iframe>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    (function () {
      var embedMode = false;
      var resumeCheckout = false;
      try {
        var bootParams = new URLSearchParams(window.location.search || '');
        embedMode = bootParams.get('embed') === '1' || window.self !== window.top;
        resumeCheckout = bootParams.get('resume') === 'checkout';
      } catch (eEmbed) {
        embedMode = window.self !== window.top;
      }
      if (embedMode) {
        try {
          document.documentElement.classList.add('embed-mode');
          document.body.classList.add('embed-mode');
        } catch (eClass) {}
      }

      function notifyMenuHangup() {
        if (!embedMode) return;
        try {
          window.parent.postMessage(
            { source: 'taco-diego', type: 'hangup' },
            window.location.origin
          );
        } catch (ePost) {}
      }

      /** Tell the homepage (or checkout) parent to scroll / jump / open checkout. */
      function notifyMenuParent(payload) {
        try {
          if (embedMode && window.parent && window.parent !== window) {
            window.parent.postMessage(
              Object.assign({ source: 'taco-diego' }, payload),
              window.location.origin
            );
            return true;
          }
        } catch (ePost) {}
        return false;
      }

      /** Persist pickup contact so /checkout can fill Full name / Email / Phone after page handoff. */
      function persistCustomerForCheckout() {
        var payload = {
          firstName: customer.firstName || '',
          lastName: customer.lastName || '',
          name: [customer.firstName, customer.lastName].filter(Boolean).join(' '),
          email: customer.email || '',
          phone: customer.phone || '',
          /* Mild / spicy / pickup time — said on the menu, must survive the page change. */
          instructions: order.instructions || '',
        };
        try {
          sessionStorage.setItem('tacoCheckoutContact', JSON.stringify(payload));
          /* Contact is worth remembering across visits; this order's chef notes are not. */
          var durable = Object.assign({}, payload);
          delete durable.instructions;
          localStorage.setItem('tacoCheckoutContact', JSON.stringify(durable));
        } catch (eStore) {}
        notifyMenuParent({
          type: 'customer_update',
          firstName: payload.firstName,
          lastName: payload.lastName,
          name: payload.name,
          email: payload.email,
          phone: payload.phone,
          instructions: payload.instructions,
        });
        return payload;
      }

      /** As soon as we have a name, pull known-guest email/phone and save for checkout. */
      function applyKnownGuestAndPersist() {
        var matched = findKnownGuest();
        if (matched) {
          if (!customer.email && matched.email) customer.email = String(matched.email);
          if (!customer.phone && matched.phone) customer.phone = String(matched.phone);
        }
        renderTicket();
        persistCustomerForCheckout();
        return matched;
      }

      /** Always open checkout WITH Diego resume — never dump to bare /checkout (kills voice). */
      function goToCheckoutWithDiego() {
        if (hangUpTimer) {
          clearTimeout(hangUpTimer);
          hangUpTimer = null;
        }
        var payload = persistCustomerForCheckout();
        try {
          sessionStorage.setItem('diegoAutostart', '1');
          sessionStorage.setItem('diegoResumeCheckout', '1');
        } catch (eFlags) {}
        /* Contact travels in storage, never in the address bar — a URL ends up in
           browser history, server logs and anything the guest shares. */
        var q = '/checkout?diego=1';
        if (notifyMenuParent({
          type: 'open_checkout',
          name: payload.name,
          email: payload.email,
          phone: payload.phone,
          instructions: payload.instructions,
          href: q,
        })) {
          return true;
        }
        try {
          window.location.href = q;
        } catch (eCo) {}
        return false;
      }

      function restoreCustomerFromStorage() {
        try {
          var raw =
            sessionStorage.getItem('tacoCheckoutContact') ||
            localStorage.getItem('tacoCheckoutContact');
          if (!raw) {
            persistCustomerForCheckout();
            return;
          }
          var c = JSON.parse(raw);
          if (!customer.firstName && c.firstName) customer.firstName = String(c.firstName);
          if (!customer.lastName && c.lastName) customer.lastName = String(c.lastName);
          if (!customer.firstName && c.name) {
            var bits = String(c.name).trim().split(/\s+/).filter(Boolean);
            if (bits.length) customer.firstName = bits[0];
            if (bits.length > 1) customer.lastName = bits.slice(1).join(' ');
          }
          if (!customer.email && c.email) customer.email = String(c.email);
          if (!customer.phone && c.phone) customer.phone = String(c.phone);
          /* Mild / spicy said on the menu must still be on the ticket after the remount. */
          if (!order.instructions && c.instructions) order.instructions = String(c.instructions);
        } catch (eStore) {}
        applyKnownGuestAndPersist();
      }

      function normalizeMenuSection(raw) {
        var s = String(raw || '')
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!s) return '';
        if (/\bburrito/.test(s)) return 'burritos';
        if (/\benchilada/.test(s)) return 'enchiladas';
        if (/\bquesadilla/.test(s)) return 'quesadillas';
        if (/\btaco/.test(s)) return 'tacos';
        if (/\b(fried|fryer|fry)\b/.test(s)) return 'fryer';
        if (/\b(drink|beverage|soda|water)\b/.test(s)) return 'drinks';
        if (/\b(side|rice|bean|extra)\b/.test(s)) return 'sides';
        if (/\bhour/.test(s)) return 'hours';
        var allowed = {
          tacos: 1,
          burritos: 1,
          enchiladas: 1,
          quesadillas: 1,
          sides: 1,
          fryer: 1,
          drinks: 1,
          hours: 1,
        };
        if (allowed[s]) return s;
        return '';
      }

      /** Push Diego ticket lines into the real website shopping cart (homepage / checkout). */
      function syncWebCart(action, payload) {
        var msg = Object.assign({ type: 'cart_' + action }, payload || {});
        if (notifyMenuParent(msg)) return true;
        try {
          if (!window.TacoCart) return false;
          if (action === 'add' && window.TacoCart.addFromVoice) {
            var added = window.TacoCart.addFromVoice(payload.title, payload.qty, payload.price);
            if (added && added.soldOut) return false;
            return !!added;
          }
          if (action === 'set' && window.TacoCart.setFromVoice) {
            return !!window.TacoCart.setFromVoice(payload.title, payload.qty, payload.price);
          }
          if (action === 'remove' && window.TacoCart.removeFromVoice) {
            return !!window.TacoCart.removeFromVoice(payload.title, payload.price);
          }
          if (action === 'clear' && window.TacoCart.clear) {
            window.TacoCart.clear();
            return true;
          }
        } catch (eCart) {}
        return false;
      }

      var btn = document.getElementById('orderNowBtn');
      function setDiegoIdleButtonLabel() {
        btn.classList.remove('live', 'canceling');
        btn.innerHTML =
          '<span class="btn-main">Diego will take your order</span>' +
          '<span class="btn-sub">Press button now</span>';
        btn.setAttribute('aria-label', 'Diego will take your order. Press button now.');
      }

      function easternShopStatus() {
        var tz = 'America/New_York';
        var now = new Date();
        var parts = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          weekday: 'long',
          hour: 'numeric',
          minute: 'numeric',
          hour12: false,
        }).formatToParts(now);
        function part(t) {
          for (var i = 0; i < parts.length; i++) {
            if (parts[i].type === t) return parts[i].value;
          }
          return '';
        }
        var day = part('weekday');
        var hour = parseInt(part('hour') || '0', 10);
        var minute = parseInt(part('minute') || '0', 10);
        var mins = hour * 60 + minute;
        var formatted = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true,
        }).format(now);
        if (day === 'Monday' || day === 'Tuesday' || day === 'Sunday') {
          return {
            formatted: formatted,
            day: day,
            mins: mins,
            open: false,
            line:
              'Right now it is ' +
              formatted +
              ' Eastern. CLOSED TODAY — ' +
              day +
              ' we are always closed. Open Wednesday–Saturday 11 AM–8 PM. Closed Sunday–Tuesday. Next open ' +
              nextOpenPhrase({ day: day, mins: mins }) +
              '.',
          };
        }
        var openStart = 11 * 60;
        var openEnd = 20 * 60;
        var hoursLabel = '11 AM–8 PM';
        var open = mins >= openStart && mins < openEnd;
        return {
          formatted: formatted,
          day: day,
          mins: mins,
          open: open,
          line: open
            ? 'Right now it is ' + formatted + ' Eastern. OPEN — today (' + day + ') ' + hoursLabel + '.'
            : 'Right now it is ' +
              formatted +
              ' Eastern. CLOSED right now — today (' +
              day +
              ') hours ' +
              hoursLabel +
              '.',
        };
      }

      /** "today at 11 AM" / "tomorrow at 11 AM" / "Wednesday at 11 AM" (Sun–Tue closed). */
      function nextOpenPhrase(st) {
        var day = st.day;
        var beforeOpen = (st.mins || 0) < 11 * 60;
        if (day === 'Monday' || day === 'Sunday') return 'Wednesday at 11 AM';
        if (day === 'Tuesday') return 'tomorrow at 11 AM';
        if (beforeOpen) return 'today at 11 AM';
        return day === 'Saturday' ? 'Wednesday at 11 AM' : 'tomorrow at 11 AM';
      }

      function renderTicket() {
        if (!ticketVisible()) {
          ticketEl.classList.remove('has-items');

        }
        ticketEl.classList.add('has-items');
        var sub = subtotal();
        var taxable = taxableSubtotal();
        var tax = Math.round(taxable * taxRate * 100) / 100;
        var tip = Math.round((Number(order.tip) || 0) * 100) / 100;
        var total = Math.round((sub + tax + tip) * 100) / 100;

        var html = '';
        // Kitchen-first: PICKUP/DELIVERY left, (Cash)/(Card) right — still inside 80mm
        html += topBannerHtml();
        if (hasCustomer()) {
          var nameBits = [customer.firstName, customer.lastName].filter(Boolean).join(' ');
          html += '<div class="cust">';
          if (nameBits) html += '<div>' + escapeHtml(nameBits) + '</div>';
          if (customer.phone) {
            html += '<div class="email">' + escapeHtml(customer.phone) + '</div>';
          }
          if (customer.email) {
            html += '<div class="email">' + escapeHtml(customer.email) + '</div>';
          }
          html += '</div>';
        }

        order.lines.forEach(function (line) {
          var qty = line.qty != null ? line.qty : 1;
          html +=
            '<div class="line">' +
            '<div class="title">' +
            escapeHtml(line.title) +
            '</div>' +
            '<div class="qty">' +

            '<div class="price">' +
            money(line.price) +
            '</div>' +
            (line.note
              ? '<div class="line-note">' + escapeHtml(line.note) + '</div>'
              : '') +
            '</div>';
        });

        if (order.lines.length) {
          html +=
            '<div class="totals">' +
            '<div class="line"><div class="title">Subtotal</div><div class="qty"></div><div class="price">' +
            money(sub) +
            '</div></div>' +

            '%</div><div class="qty"></div><div class="price">' +

            money(tip) +

            money(total) +

        if (order.instructions && String(order.instructions).trim()) {

      function findKnownGuest(extra) {
        extra = extra || {};
        var first = String(extra.firstName || customer.firstName || '')
          .trim()
          .toLowerCase();
        var last = String(extra.lastName || customer.lastName || '')
          .trim()
          .toLowerCase();
        var email = String(extra.email || customer.email || '')
          .trim()
          .toLowerCase();
        var phoneDigits = String(extra.phone || customer.phone || '').replace(/\D/g, '');
        for (var i = 0; i < knownGuests.length; i++) {
          var g = knownGuests[i] || {};
          var gf = String(g.firstName || '')
            .trim()
            .toLowerCase();
          var gl = String(g.lastName || '')
            .trim()
            .toLowerCase();
          var ge = String(g.email || '')
            .trim()
            .toLowerCase();
          var gp = String(g.phone || '').replace(/\D/g, '');
          if (first && last && gf === first && gl === last) return g;
          if (email && ge && email === ge) return g;
          if (phoneDigits.length >= 10 && gp && phoneDigits.slice(-10) === gp.slice(-10)) {
            return g;
          }
        }
        return null;
      }

          memories: Array.isArray(g.notes) ? g.notes.slice() : [],

      async function askSupervisor(question) {
        var resp = await fetch('/api/supervisor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, history: history }),
        });
        if (!resp.ok) {
          var errText = await resp.text().catch(function () { return ''; });
          throw new Error('supervisor ' + resp.status + (errText ? ': ' + errText.slice(0, 160) : ''));
        }
        var data = await resp.json();
        return (data.answer || '').trim();
      }

      async function handleAskSupervisor(callId, rawArgs) {
        var question = '';
        try {
          var args = typeof rawArgs === 'string' ? JSON.parse(rawArgs || '{}') : (rawArgs || {});
          question = (args.question || '').trim();
        } catch (e) {
          question = String(rawArgs || '').trim();
        }
        if (!question) question = 'Help with the customer order.';

        setStatus('Diego thinking…');
        var answer = '';
        try {
          answer = await askSupervisor(question);
        } catch (e) {
          console.error('[Taco Supervisor]', e);
          answer = 'Call us at (978) 982-1800.';
        }
        replyTool(callId, answer);
        setStatus('Diego is on — talk anytime');
      }

      async function callMem0(action, payload) {
        try {
          var resp = await fetch('/api/mem0', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ action: action }, payload || {})),
          });
          var data = await resp.json().catch(function () { return {}; });
          if (!resp.ok) {
            // Soft-fail — never stall Diego (503 = Mem0 not configured)
            return {
              ok: true,
              skipped: true,
              configured: false,
              memories: [],
              error: data.error || ('mem0 ' + resp.status),
              hint: data.hint || '',
            };
          }
          return data;
        } catch (e) {
          return { ok: true, skipped: true, configured: false, memories: [], error: 'mem0 network' };
        }
      }

      function handleOrderTool(name, callId, rawArgs) {
        var args = {};
        try {
          args = typeof rawArgs === 'string' ? JSON.parse(rawArgs || '{}') : (rawArgs || {});
        } catch (e) {
          args = {};
        }

        if (name === 'add_order_line') {
          var title = String(args.title || '').trim();
          var price = Number(args.price);
          var qty = args.qty != null ? Number(args.qty) : 1;
          if (!title || !isFinite(price)) {
            replyTool(callId, { ok: false, error: 'title and price required' });
            return;
          }
          var lineQty = isFinite(qty) && qty > 0 ? qty : 1;

          fetch('/api/sold-out', { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : { items: [], ids: [] };
            })
            .catch(function () {
              return { items: [], ids: [] };
            })
            .then(function (sold) {
              var soldItems = Array.isArray(sold.items) ? sold.items : [];
              var titleNorm = String(title)
                .toLowerCase()
                .replace(/[·•|]/g, ' ')
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
              var blocked = soldItems.some(function (name) {
                var n = String(name)
                  .toLowerCase()
                  .replace(/[·•|]/g, ' ')
                  .replace(/[^a-z0-9\s]/g, ' ')
                  .replace(/\s+/g, ' ')
                  .trim();
                return n === titleNorm || titleNorm.indexOf(n) >= 0 || n.indexOf(titleNorm) >= 0;
              });
              if (blocked) {
                replyTool(callId, {
                  ok: false,
                  soldOut: true,
                  speakHint:
                    'That item is sold out / unavailable today. Do not add it. Tell them warmly and suggest another protein or item.',
                });
                return;
              }
              order.lines.push({
                title: title,
                price: price,
                qty: lineQty,
                note: args.note ? String(args.note).trim() : '',
                taxIncluded: !!args.taxIncluded,
              });
              renderTicket();
              var cartOk = syncWebCart('add', { title: title, price: price, qty: lineQty });
              replyTool(callId, {
                ok: true,
                ticket: ticketSnapshot(),
                webCartSynced: cartOk,
                speakHint: cartOk
                  ? 'Item is on the ticket AND the shopping cart / checkout on their screen. Confirm short, then ask protein only if they said a bare category.'
                  : 'Item is on your voice ticket. If their shopping cart did not update, ask them to tap + on the menu or say the protein again.',
              });
            });
          return;
        }

        if (name === 'set_customer') {
          if (args.firstName != null && String(args.firstName).trim()) {
            customer.firstName = String(args.firstName).trim();
          }
          if (args.lastName != null && String(args.lastName).trim()) {
            customer.lastName = String(args.lastName).trim();
          }
          if (args.email != null && String(args.email).trim()) {
            customer.email = String(args.email).trim().toLowerCase();
          }
          if (args.phone != null && String(args.phone).trim()) {
            customer.phone = String(args.phone).trim();
          }
          var matched = applyKnownGuestAndPersist();
          var out = { ok: true, ticket: ticketSnapshot(), savedForCheckout: true };
          if (matched) {
            var mem = knownGuestPayload(matched);
            out.knownGuest = true;
            out.memories = mem.memories;
            out.speakHint = mem.speakHint;
          }
          out.speakHint =
            (out.speakHint ? out.speakHint + ' ' : '') +
            'Name is saved NOW (menu page is fine). Checkout pickup Full name will already show it. If email/phone still missing, ask those next — one at a time.';
          replyTool(callId, out);
          return;
        }

        if (name === 'set_fulfillment') {
          var ft = String(args.type || '').trim().toLowerCase();
          fulfillment = ft === 'delivery' ? 'delivery' : ft === 'pickup' ? 'pickup' : '';
          renderTicket();
          var fOut = { ok: true, ticket: ticketSnapshot() };
          if (fulfillment === 'delivery') {
            fOut.speakHint =
              'Pickup only on our site — no delivery apps here. Offer call_restaurant to dial (978) 982-1800 if they want to phone in.';
          }
          replyTool(callId, fOut);
          return;
        }

        if (name === 'call_restaurant') {
          window.open(TACO_PHONE_TEL, '_self');
          replyTool(callId, {
            ok: true,
            speakHint:
              'Dialer opening for (978) 982-1800. Say you are connecting them — may ring a few times if staff are with a customer at the counter.',
          });
          return;
        }

        if (name === 'get_current_datetime' || name === 'get_current_time') {
          var st = easternShopStatus();
          fetch('/api/shop-status', { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            })
            .then(function (override) {
              var line = st.line;
              var open = st.open;
              if (override && override.closed) {
                open = false;
                line =
                  'EMERGENCY / EARLY CLOSE — CLOSED for the rest of today. ' +
                  (override.reason ? 'Reason: ' + override.reason + '. ' : '') +
                  st.formatted +
                  ' Eastern.';
              }
              replyTool(callId, {
                ok: true,
                datetime: st.formatted,
                open: open,
                status: line,
                emergencyClosed: !!(override && override.closed),
                reason: (override && override.reason) || '',
                speakHint: line,
              });
            });

        }
        if (
          (data.type === 'conversation.item.input_audio_transcription.completed' ||
            data.type === 'conversation.item.input_audio_transcription.done') &&
          data.transcript
        ) {
          pushHistory('customer', data.transcript);
          maybeCaptureFirstName(data.transcript);
          maybeAutoHangUp(data.transcript, 'customer');
          return;
        }
      }

      function maybeCaptureFirstName(transcript) {
        var raw = String(transcript || '').trim();
        if (!raw) return;
        var t = raw
          .replace(/^((hi|hey|hello|yes|yeah|uh|um)[,.\s]+)+/i, '')
          .replace(/^(i('?m| am)|my name is|this is|it'?s)\s+/i, '')
          .replace(/[.,!?]+$/g, '')
          .trim();
        var words = t.split(/\s+/).filter(Boolean);
        /* Full name up front: "Frank Martino" or "Frank A Martino" */
        if (words.length < 1 || words.length > 3) return;
        if (
          /taco|burrito|beef|chicken|pork|shrimp|coke|drink|order|spicy|mild|please|thanks|thank|checkout|email|phone/i.test(
            t
          )
        ) {
          return;
        }
        var first = words[0].replace(/[^A-Za-z'-]/g, '');
        if (first.length < 2) return;
        var last = '';
        if (words.length >= 2) {
          last = words
            .slice(1)
            .map(function (w) {
              return w.replace(/[^A-Za-z'-]/g, '');
            })
            .filter(function (w) {
              return w.length > 1;
            })
            .join(' ');
        }
        /* Don't overwrite a fuller name already saved */
        if (customer.firstName && customer.lastName && last && customer.lastName.length >= last.length) {
          return;
        }
        customer.firstName = first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
        if (last) {
          customer.lastName = last
            .split(/\s+/)
            .map(function (w) {
              return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            })
            .join(' ');
        }
        applyKnownGuestAndPersist();
      }

      function captureAndDescribeScreen() {
        var ticketFallback = ticketSnapshot();
        function describeWithVision(base64) {
          return fetch('/api/vision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 }),
          }).then(function (r) {
            return r.json().then(function (data) {
              if (!r.ok) {
                return {
                  ok: false,
                  error: (data && data.error) || 'vision http ' + r.status,
                  ticket: ticketFallback,
                  screenText: '',
                };
              }
              return {
                ok: true,
                screenText: (data && data.text) || '',
                ticket: ticketFallback,
              };
            });
          });
        }

        if (typeof html2canvas !== 'function') {
          return Promise.resolve({
            ok: true,
            screenText: 'Use structured ticket. ' + JSON.stringify(ticketFallback),
            ticket: ticketFallback,
          });
        }

        return html2canvas(document.documentElement, {
          backgroundColor: '#1c1917',
          scale: 0.55,
          useCORS: true,
          logging: false,
          windowWidth: Math.max(document.documentElement.scrollWidth, window.innerWidth),
          windowHeight: Math.max(document.documentElement.scrollHeight, window.innerHeight),
        }).then(function (canvas) {
          var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          var base64 = dataUrl.replace(/^data:image\/jpeg;base64,/, '');
          return describeWithVision(base64);
        });
      }

      function stopAllMedia() {
        try {
          remoteAudio.muted = true;
          remoteAudio.pause();
          remoteAudio.volume = 0;
          remoteAudio.srcObject = null;
          remoteAudio.removeAttribute('src');
          remoteAudio.load();
        } catch (e) {}
        if (localStream) {
          localStream.getTracks().forEach(function (t) {
            try {
              t.stop();
            } catch (e2) {}
          });
        }
        if (pc) {
          try {
            pc.getSenders().forEach(function (s) {
              if (s.track) {
                try {
                  s.track.stop();
                } catch (e3) {}
              }
            });
          } catch (e4) {}
          try {
            pc.getReceivers().forEach(function (r) {
              if (r.track) {
                try {
                  r.stop();
                  r.track.stop();
                } catch (e5) {}
              }
            });
          } catch (e6) {}
          try {
            pc.onicecandidate = null;
            pc.ontrack = null;
            pc.onconnectionstatechange = null;
            pc.close();
          } catch (e7) {}
        }
      }

      function cleanup() {
        sessionAlive = false;
        connecting = false;
        connected = false;
        if (hangUpTimer) {
          clearTimeout(hangUpTimer);
          hangUpTimer = null;
        }
        try {
          if (dc && dc.readyState === 'open') {
            try {
              dc.send(JSON.stringify({ type: 'response.cancel' }));
            } catch (e) {}
            try {
              dc.send(JSON.stringify({ type: 'output_audio_buffer.clear' }));
            } catch (e2) {}
          }
        } catch (e3) {}
        try {
          if (dc) dc.close();
        } catch (e4) {}
        stopAllMedia();
        pc = null;
        dc = null;
        localStream = null;
        history = [];
        pendingCalls = {};
        btn.disabled = false;
        btn.classList.remove('live');
        btn.classList.remove('canceling');
        setDiegoIdleButtonLabel();
      }

      function hangUp() {
        intentionallyHungUp = true;
        connectGen += 1; // invalidate any in-flight startDiego
        sessionAlive = false;
        connecting = false;
        connected = false;
        try {
          closeVoiceSignupPopup();
        } catch (eClose) {}
        if (hangUpTimer) {
          clearTimeout(hangUpTimer);
          hangUpTimer = null;
        }
        resetOrder();
        resetCustomer();
        renderTicket();
        setStatus('');
        cleanup();
        // Keep muted until next Order Now unlocks playback
        try {
          remoteAudio.muted = true;
          remoteAudio.volume = 0;
        } catch (e) {}
        if (embedMode) {
          notifyMenuHangup();
          setDiegoIdleButtonLabel();
          return;
        }
        /* Full-page /voice only — back to homepage */
        window.location.href = '/';
      }

      function callInProgress() {
        return !!(
          connected ||
          sessionAlive ||
          connecting ||
          btn.classList.contains('live') ||
          btn.classList.contains('canceling') ||
          pc
        );
      }

      function maybeAutoHangUp(transcript, who) {
        var t = String(transcript || '').toLowerCase();
        if (!t) return;

        // After paid or a queued cash ticket: Diego's closing goodbye ends the
        // call (was leaving dead air). Never a blind timer — only the goodbye.
        if (who === 'diego' && (order.paid || order.cashQueued)) {
          var diegoDone =
            /\b(see you soon|have a great|take care|catch you|arrivederci|my pleasure)\b/i.test(t) ||
            /\b(ready for pickup|start making (your|the) food)\b/i.test(t);
          if (diegoDone) {
            if (hangUpTimer) clearTimeout(hangUpTimer);
            hangUpTimer = setTimeout(function () {
              if (!callInProgress()) return;
              hangUp();
            }, 3500);
          }
          return;
        }

        if (who !== 'customer') return;
        var bye =
          /\b(bye|goodbye|good bye|hang up|end call|end the call)\b/i.test(t) ||
          /\b(start over|start all over|start again|all over again)\b/i.test(t) ||
          /\b(thank you|thanks).{0,40}\b(bye|goodbye)\b/i.test(t) ||
          // After paid / cash queued, plain thanks is enough to hang up
          ((order.paid || order.cashQueued) &&
            /\b(thank you|thanks|ok thanks|okay thanks|appreciate it)\b/i.test(t));
        if (!bye) {
          /* They are still talking — cancel any armed goodbye. A customer asking
             "what time do you close?" must never be hung up on mid-answer. */
          if (hangUpTimer) {
            clearTimeout(hangUpTimer);
            hangUpTimer = null;
          }
          return;
        }
        if (hangUpTimer) clearTimeout(hangUpTimer);
        // ~4s after customer farewell — room for Diego's last line
        hangUpTimer = setTimeout(function () {
          if (!callInProgress()) return;
          hangUp();
        }, 4000);
      }

      async function startDiego() {
        if (callInProgress()) {
          hangUp();
          return;
        }
        var myGen = ++connectGen;
        function stillThisConnect() {
          return myGen === connectGen && !intentionallyHungUp;
        }
        connecting = true;
        sessionAlive = false;
        intentionallyHungUp = false;
        btn.disabled = false;
        btn.classList.add('canceling');
        btn.classList.remove('live');
        btn.textContent = 'Hang Up';
        btn.setAttribute('aria-label', 'Hang up');
        setStatus('Talking to Diego…');
        resetOrder();
        resetCustomer();
        /* Checkout remount must NOT wipe the name we already saved on the menu. */
        restoreCustomerFromStorage();
        renderTicket();

        // Unlock playback under the click gesture (autoplay after awaits is flaky).
        try {
          remoteAudio.muted = false;
          remoteAudio.volume = 1;
          remoteAudio.play().catch(function () {});
        } catch (eUnlock) {}

        try {
          var tokenPromise = fetch('/api/realtime-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(resumeCheckout ? { resume: 'checkout' } : {}),
          }).then(async function (resp) {
            if (!resp.ok) {
              var errText = await resp.text().catch(function () { return ''; });
              throw new Error('token ' + resp.status + (errText ? ': ' + errText.slice(0, 180) : ''));
            }
            return resp.json();
          });

          localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
          if (!stillThisConnect()) {
            cleanup();
            return;
          }

          pc = new RTCPeerConnection();
          localStream.getTracks().forEach(function (track) {
            pc.addTrack(track, localStream);
          });

          pc.ontrack = function (ev) {
            // Never stop the remote track here. Early ontrack (before sessionAlive)
            // used to kill Diego's audio for the whole call.
            if (intentionallyHungUp || myGen !== connectGen) return;
            var stream = ev.streams && ev.streams[0] ? ev.streams[0] : new MediaStream([ev.track]);
            remoteAudio.muted = false;
            remoteAudio.srcObject = stream;
            remoteAudio.volume = 1;
            remoteAudio.play().catch(function () {});
          };

          var greetingExact = resumeCheckout
            ? customer.firstName
              ? "We're at checkout, " +
                customer.firstName +
                ". Your name should already be on pickup details — email and phone if needed, then tip, then card or cash."
              : "We're at checkout — first and last name for pickup?"
            : "Hi, I'm Diego — first and last name please?";
          var dcOpen = false;
          var greetingArmed = false;
          var greetingSpoken = false;

          function speakFixedGreeting() {
            if (!stillThisConnect() || !sessionAlive || !dcOpen || !greetingArmed || greetingSpoken) return;
            greetingSpoken = true;
            greetingArmed = false;
            var follow = resumeCheckout
              ? 'Say that EXACT line once in one smooth breath — no long pause mid-sentence. Then STOP and listen. Do NOT re-introduce yourself. Do NOT restart the menu greeting.'
              : 'Say that EXACT line once in one smooth breath — no dramatic pause after Hi or after your name. No language choice. Then STOP and listen for their name only. Nothing else. Do not repeat yourself.';
            dcSend({
              type: 'response.create',
              response: {
                instructions:
                  'Happy pleasant smiling tone, snappy natural pace. Say EXACTLY and ONLY: "' +
                  greetingExact +
                  '" ' +
                  follow,
              },
            });
          }

          dc = pc.createDataChannel('oai-events');
          dc.addEventListener('message', function (ev) {
            if (!sessionAlive || myGen !== connectGen) return;
            onServerEvent(ev.data);
          });
          dc.addEventListener('open', function () {
            if (!stillThisConnect()) return;
            dcOpen = true;
            speakFixedGreeting();
          });

          var offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          if (!stillThisConnect()) {
            cleanup();
            return;
          }

          var tokenPayload = await tokenPromise;
          if (!stillThisConnect()) {
            cleanup();
            return;
          }
          var ephemeralKey = (tokenPayload.value || '').trim();
          if (!ephemeralKey) throw new Error('Missing ephemeral token');
          if (tokenPayload.greetingExact) greetingExact = String(tokenPayload.greetingExact);
          if (tokenPayload.resume === 'checkout') {
            resumeCheckout = true;
          }
          if (tokenPayload.taxRate != null && isFinite(Number(tokenPayload.taxRate))) {
            taxRate = Number(tokenPayload.taxRate);
          }
          if (Array.isArray(tokenPayload.knownGuests)) {
            knownGuests = tokenPayload.knownGuests;
          }
          restoreCustomerFromStorage();
          renderTicket();
          if (tokenPayload.greetingExact && !resumeCheckout) {
            greetingExact = String(tokenPayload.greetingExact);
          } else if (resumeCheckout && customer.firstName) {
            greetingExact =
              "We're at checkout, " +
              customer.firstName +
              '. Your name should already be on pickup details. Confirm email and phone if needed, then tip, then card or cash.';
          } else if (tokenPayload.greetingExact) {
            greetingExact = String(tokenPayload.greetingExact);
          }
          /* Frank: "you have to tell me if the restaurant is closed — give me a
             heads up." Closed goes in the FIRST breath, not after the order. */
          var shopNow = easternShopStatus();
          if (tokenPayload.shopOpen === false || !shopNow.open) {
            greetingExact +=
              " Quick heads up — we're closed right now; we open " +
              nextOpenPhrase(shopNow) +
              '. Happy to answer questions or plan your next order.';
          }
          // Arm BEFORE SDP answer — ontrack fires on setRemoteDescription; if
          // sessionAlive is still false, older code stopped the remote track (silence).
          greetingArmed = true;
          sessionAlive = true;

          var sdpResp = await fetch('https://api.openai.com/v1/realtime/calls', {
            method: 'POST',
            body: offer.sdp,
            headers: {
              Authorization: 'Bearer ' + ephemeralKey,
              'Content-Type': 'application/sdp',
            },
          });
          if (!sdpResp.ok) {
            var sdpErr = await sdpResp.text().catch(function () { return ''; });
            throw new Error('realtime ' + sdpResp.status + (sdpErr ? ': ' + sdpErr.slice(0, 180) : ''));
          }
          if (!stillThisConnect()) {
            cleanup();
            return;
          }
          var answerSdp = await sdpResp.text();
          await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
          if (!stillThisConnect()) {
            cleanup();
            return;
          }

          try {
            remoteAudio.muted = false;
            remoteAudio.volume = 1;
            remoteAudio.play().catch(function () {});
          } catch (ePlay) {}

          // One shot — if data channel already open, speak now; else open handler will
          speakFixedGreeting();

          connected = true;
          connecting = false;
          btn.disabled = false;
          btn.classList.remove('canceling');
          btn.classList.add('live');
          btn.textContent = 'Hang Up';
        btn.setAttribute('aria-label', 'Hang up');
          setStatus('Diego is on — ticket updates as you order');
        } catch (e) {
          console.error('[Taco Diego]', e);
          if (stillThisConnect()) {
            cleanup();
            setStatus('Could not start Diego. Try again.');
          }
        }
      }

      btn.addEventListener('click', function () {
        if (callInProgress()) {
          hangUp();
          return;
        }
        startDiego();
      });

      window.addEventListener('message', function (ev) {
        if (!embedMode) return;
        if (ev.origin !== window.location.origin) return;
        var data = ev.data;
        if (!data || data.source !== 'taco-menu') return;
        if (data.type === 'hangup') hangUp();
      });

      /* Homepage sheet → /voice?start=1&embed=1 — connect immediately, stay on menu. */
      (function maybeAutostartDiego() {
        var params = new URLSearchParams(window.location.search || '');
        var wantStart = params.get('start') === '1';
        try {
          if (sessionStorage.getItem('diegoAutostart') === '1') wantStart = true;
          sessionStorage.removeItem('diegoAutostart');
        } catch (eSs) {}
        if (!wantStart) return;
        try {
          var keep =
            embedMode
              ? resumeCheckout
                ? '/voice?embed=1&resume=checkout'
                : '/voice?embed=1'
              : '/voice';
          history.replaceState({}, '', keep);
        } catch (eHist) {}
        setStatus('Talking to Diego…');
        startDiego();
      })();
    })();
  </script>
</body>
</html>
