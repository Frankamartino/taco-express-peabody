<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Kitchen Order Alert · Taco Express</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #15100d;
      color: #fff7e9;
    }
    main {
      width: min(680px, calc(100% - 28px));
      padding: 28px;
      border: 3px solid #f5b82e;
      border-radius: 24px;
      background: #241814;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 58px); }
    p { font-size: 20px; line-height: 1.4; }
    button {
      width: 100%;
      min-height: 76px;
      margin-top: 14px;
      border: 0;
      border-radius: 18px;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 800;
      cursor: pointer;
      color: #28110a;
      background: linear-gradient(#ffd86c, #ef9d17);
      box-shadow: inset 0 3px 1px rgba(255,255,255,.55), 0 7px 0 #9b5108;
    }
    button:active { transform: translateY(4px); box-shadow: inset 0 2px 1px rgba(255,255,255,.45), 0 3px 0 #9b5108; }
    #acknowledge { background: linear-gradient(#91f59b, #32b54c); box-shadow: inset 0 3px 1px rgba(255,255,255,.55), 0 7px 0 #157729; }
    #orderCard {
      display: none;
      margin-top: 24px;
      padding: 24px;
      border-radius: 18px;
      color: #2c0804;
      background: #ff5545;
      animation: pulse 1s infinite alternate;
    }
    #orderCard.active { display: block; }
    #orderTitle { margin: 0; font-size: clamp(34px, 7vw, 60px); }
    #orderMeta { font-size: 23px; font-weight: 700; }
    #status { min-height: 30px; color: #ffd86c; font-weight: 700; }
    .ready { color: #91f59b !important; }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,85,69,.25); } to { box-shadow: 0 0 0 16px rgba(255,85,69,0); } }
  </style>
</head>
<body>
  <main>
    <h1>Taco Express Orders</h1>
    <p>Keep this screen open on the restaurant computer.</p>
    <button id="enableSound" type="button">Enable order sound</button>
    <p id="status">Tap once to allow sound on this computer.</p>

    <section id="orderCard" aria-live="assertive">
      <h2 id="orderTitle">NEW ORDER</h2>
      <p id="orderMeta"></p>
      <button id="acknowledge" type="button">Acknowledge order</button>
    </section>
  </main>

  <script>
    (function () {
      var ACK_KEY = 'tacoKitchenAcknowledgedV1';
      var enableButton = document.getElementById('enableSound');
      var acknowledgeButton = document.getElementById('acknowledge');
      var status = document.getElementById('status');
      var orderCard = document.getElementById('orderCard');
      var orderMeta = document.getElementById('orderMeta');
      var audioContext = null;
      var alarmTimer = null;
      var titleTimer = null;
      var activeAlert = null;
      var alerts = [];

      function loadAcknowledged() {
        try {
          var parsed = JSON.parse(localStorage.getItem(ACK_KEY) || '{}');
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function saveAcknowledged(acknowledged) {
        var cutoff = Date.now() - 48 * 60 * 60 * 1000;
        Object.keys(acknowledged).forEach(function (id) {
          if (Number(acknowledged[id]) < cutoff) delete acknowledged[id];
        });
        localStorage.setItem(ACK_KEY, JSON.stringify(acknowledged));
      }

      function beep() {
        if (!audioContext) return;
        var now = audioContext.currentTime;
        [0, 0.42].forEach(function (offset, index) {
          var oscillator = audioContext.createOscillator();
          var gain = audioContext.createGain();
          oscillator.type = 'square';
          oscillator.frequency.value = index ? 660 : 880;
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.3);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now + offset);
          oscillator.stop(now + offset + 0.32);
        });
      }

      function stopAlarm() {
        if (alarmTimer) window.clearInterval(alarmTimer);
        if (titleTimer) window.clearInterval(titleTimer);
        alarmTimer = null;
        titleTimer = null;
        document.title = 'Kitchen Order Alert · Taco Express';
      }

      function startAlarm() {
        if (!audioContext || !activeAlert || alarmTimer) return;
        beep();
        alarmTimer = window.setInterval(beep, 1200);
        var flash = false;
        titleTimer = window.setInterval(function () {
          flash = !flash;
          document.title = flash ? '🔔 NEW TACO ORDER' : 'Touch Acknowledge';
        }, 700);
      }

      function showNextAlert() {
        var acknowledged = loadAcknowledged();
        var freshCutoff = Date.now() - 30 * 60 * 1000;
        activeAlert =
          alerts.find(function (alert) {
            var created = Date.parse(alert.createdAt || '');
            return !acknowledged[alert.id] && (!created || created >= freshCutoff);
          }) || null;

        if (!activeAlert) {
          orderCard.classList.remove('active');
          orderMeta.textContent = '';
          stopAlarm();
          if (audioContext) {
            status.textContent = 'Sound is on · waiting for the next order';
            status.className = 'ready';
          }
          return;
        }

        var label = activeAlert.ticketNumber ? 'Ticket #' + activeAlert.ticketNumber : activeAlert.orderId;
        var when = activeAlert.createdAt
          ? new Date(activeAlert.createdAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
          : 'just now';
        orderMeta.textContent = label + ' · ' + when;
        orderCard.classList.add('active');
        status.textContent = 'Ringing until the order is acknowledged';
        status.className = '';
        startAlarm();
      }

      function poll() {
        fetch('/api/kitchen-alerts', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('queue unavailable');
            return response.json();
          })
          .then(function (data) {
            alerts = Array.isArray(data.alerts) ? data.alerts : [];
            showNextAlert();
          })
          .catch(function () {
            status.textContent = 'Cannot reach the order queue · retrying';
            status.className = '';
          });
      }

      enableButton.addEventListener('click', function () {
        var AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) {
          status.textContent = 'This browser cannot play the order sound.';
          return;
        }
        if (!audioContext) audioContext = new AudioCtor();
        audioContext.resume().then(function () {
          enableButton.hidden = true;
          status.textContent = 'Sound is on · checking for orders';
          status.className = 'ready';
          beep();
          poll();
        });
      });

      acknowledgeButton.addEventListener('click', function () {
        if (!activeAlert) return;
        var acknowledged = loadAcknowledged();
        acknowledged[activeAlert.id] = Date.now();
        saveAcknowledged(acknowledged);
        stopAlarm();
        activeAlert = null;
        showNextAlert();
      });

      poll();
      window.setInterval(poll, 3000);
    })();
  </script>
</body>
</html>
