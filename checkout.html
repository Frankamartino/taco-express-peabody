<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taco Express Peabody — Checkout</title>
  <link rel="canonical" href="https://www.tacoexpresspeabody.com/checkout" />
  <link rel="icon" href="images/taco-express-logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="images/taco-express-logo.jpg" />
  <link rel="stylesheet" href="css/taco-cart.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --lime: #84cc16; --terra: #ea580c; --cream: #fffbeb; --ink: #1c1917; --border: rgba(255,255,255,0.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--ink); color: var(--cream); min-height: 100vh; padding: 0 18px 40px; }
    .top-bar { background: #14532d; color: #bbf7d0; text-align: center; padding: 8px 14px; font-size: 0.78rem; font-weight: 600; width: calc(100% + 36px); margin: 0 -18px; }
    .top-bar a { color: #fff; text-decoration: none; font-weight: 700; }
    .wrap { max-width: 520px; margin: 0 auto; padding-top: 24px; }
    .brand { text-align: center; margin-bottom: 22px; }
    .brand img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: #fff; margin-bottom: 10px; }
    h1 { font-family: "Bebas Neue", sans-serif; font-size: 2.4rem; letter-spacing: 0.06em; color: var(--lime); line-height: 1; }
    .back { display: inline-block; margin-top: 10px; color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .panel { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: rgba(255,255,255,0.04); margin-bottom: 16px; }
    .panel h2 { font-family: "Bebas Neue", sans-serif; font-size: 1.4rem; letter-spacing: 0.04em; margin-bottom: 12px; }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .line:last-child { border-bottom: 0; }
    .line .name { flex: 1; }
    .totals .line { border-bottom: 0; padding: 4px 0; }
    .totals .grand { font-weight: 800; font-size: 1.05rem; color: var(--lime); margin-top: 6px; }
    label { display: block; font-size: 0.82rem; font-weight: 700; margin: 12px 0 6px; }
    input, textarea { width: 100%; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.25); color: #fff; padding: 11px 12px; font: inherit; }
    textarea { min-height: 72px; resize: vertical; }
    .pay-btn { width: 100%; margin-top: 18px; border: 0; border-radius: 999px; background: var(--terra); color: #fff; font-weight: 800; font-size: 1rem; padding: 14px 18px; cursor: pointer; }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #msg { margin-top: 14px; min-height: 1.2em; font-weight: 600; text-align: center; }
    #msg.err { color: #fca5a5; }
    .note { margin-top: 12px; font-size: 0.82rem; color: rgba(255,251,235,0.65); text-align: center; line-height: 1.45; }
    .empty { color: rgba(255,251,235,0.7); line-height: 1.5; }
    .empty a { color: var(--lime); font-weight: 700; }
  </style>
</head>
<body>
  <div class="top-bar">58 Pulaski St · Peabody MA 01960 · <a href="tel:+19789821800">(978) 982-1800</a></div>
  <div class="wrap">
    <div class="brand">
      <img src="images/taco-express-logo.jpg" width="88" height="88" alt="Taco Express Peabody" />
      <h1>Checkout</h1>
      <a class="back" href="/">← Back to menu</a>
    </div>
    <div class="panel">
      <h2>Your order</h2>
      <div id="lines"></div>
      <div class="totals">
        <div class="line"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="line"><span>Tax (7%)</span><span id="tax">$0.00</span></div>
        <div class="line grand"><span>Total</span><span id="total">$0.00</span></div>
      </div>
    </div>
    <div class="panel" id="payPanel">
      <h2>Pickup details</h2>
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" required />
      <label for="email">Email (Stripe receipt)</label>
      <input id="email" type="email" autocomplete="email" required />
      <label for="phone">Phone</label>
      <input id="phone" type="tel" autocomplete="tel" inputmode="tel" required />
      <label for="instructions">Special instructions (optional)</label>
      <textarea id="instructions" placeholder="Mild or spicy, pickup time, etc."></textarea>
      <button type="button" class="pay-btn" id="payBtn">Pay with card</button>
      <p id="msg" aria-live="polite"></p>
      <p class="note">Secure Stripe checkout · pickup at 58 Pulaski St, Peabody</p>
    </div>
  </div>
  <script src="/js/menu-catalog-data.js"></script>
  <script src="/js/taco-cart.js"></script>
  <script>
    (function () {
      var payBtn = document.getElementById('payBtn');
      var payPanel = document.getElementById('payPanel');
      var msg = document.getElementById('msg');

      function money(cents) { return '$' + (cents / 100).toFixed(2); }

      function syncStepper(stepper, qty) {
        var count = stepper.querySelector('.qty-count');
        var minus = stepper.querySelector('.qty-minus');
        if (count) count.textContent = String(qty);
        if (minus) minus.disabled = qty <= 0;
      }

      function render() {
        var cart = window.TacoCart.load();
        var catalog = window.TacoCart.catalogById();
        var linesEl = document.getElementById('lines');
        linesEl.innerHTML = '';

        if (!cart.length) {
          linesEl.innerHTML = '<p class="empty">Your cart is empty. <a href="/">Go back and use + on anything you want.</a></p>';
          if (payPanel) payPanel.hidden = true;
          return;
        }

        var rendered = 0;
        cart.forEach(function (row) {
          var item = catalog[row.id];
          if (!item) return;
          rendered += 1;
          var line = document.createElement('div');
          line.className = 'checkout-line';

          var name = document.createElement('span');
          name.className = 'line-name';
          name.textContent = item.name;

          var stepper = window.TacoCart.createStepper(row.id, true);
          syncStepper(stepper, row.qty);

          var price = document.createElement('span');
          price.className = 'line-price';
          price.textContent = money(item.priceCents * row.qty);

          line.appendChild(name);
          line.appendChild(stepper);
          line.appendChild(price);
          linesEl.appendChild(line);
        });

        if (!rendered) {
          linesEl.innerHTML = '<p class="empty">Loading your order…</p>';
          if (payBtn) payBtn.disabled = true;
          return;
        }

        if (payPanel) payPanel.hidden = false;
        var totals = window.TacoCart.totals();
        document.getElementById('subtotal').textContent = money(totals.subtotalCents);
        document.getElementById('tax').textContent = money(totals.taxCents);
        document.getElementById('total').textContent = money(totals.totalCents);
        if (payBtn) payBtn.disabled = totals.totalCents < 50;
      }

      if (new URLSearchParams(window.location.search).get('canceled') === '1') {
        msg.textContent = 'Payment canceled — your cart is still here.';
        msg.className = 'err';
      }

      payBtn.addEventListener('click', function () {
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var phone = document.getElementById('phone').value.trim();
        msg.textContent = '';
        msg.className = '';
        if (!name) { msg.textContent = 'Please enter your name.'; msg.className = 'err'; return; }
        if (!email || email.indexOf('@') < 1) { msg.textContent = 'Please enter a valid email.'; msg.className = 'err'; return; }
        if (!phone) { msg.textContent = 'Please enter your phone.'; msg.className = 'err'; return; }

        payBtn.disabled = true;
        payBtn.textContent = 'Opening Stripe…';
        fetch('/api/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cart: window.TacoCart.load(),
            name: name,
            email: email,
            phone: phone,
            instructions: document.getElementById('instructions').value.trim(),
            fulfillment: 'pickup',
          }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (!res.ok || !res.data.checkoutUrl) throw new Error((res.data && res.data.error) || 'Could not start checkout.');
            window.location.href = res.data.checkoutUrl;
          })
          .catch(function (err) {
            msg.textContent = err.message || 'Checkout failed.';
            msg.className = 'err';
            payBtn.disabled = false;
            payBtn.textContent = 'Pay with card';
          });
      });

      document.addEventListener('taco-cart-ready', render);
      document.addEventListener('taco-cart-updated', render);
      render();
    })();
  </script>
</body>
</html>
